<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Zahoum — anime-inspired neon night city</title>
  <desc id="desc">A custom vector illustration of a moonlit neon city, stars, glowing windows, and a hooded coder silhouette in a purple and cyan palette.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b1b"/>
      <stop offset="0.45" stop-color="#20123d"/>
      <stop offset="1" stop-color="#071a31"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#a855f7" stop-opacity=".65"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28234b"/>
      <stop offset="1" stop-color="#090f22"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="windows" width="22" height="24" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="8" height="10" rx="1" fill="#67e8f9" opacity=".5"/>
      <rect x="15" y="5" width="3" height="10" rx="1" fill="#c4b5fd" opacity=".38"/>
    </pattern>
  </defs>
  <rect width="1200" height="370" rx="20" fill="url(#sky)"/>
  <circle cx="920" cy="90" r="105" fill="url(#moonGlow)"/>
  <circle cx="920" cy="90" r="43" fill="#d9e8ff" opacity=".92"/>
  <circle cx="936" cy="76" r="38" fill="#a5b4fc" opacity=".45"/>
