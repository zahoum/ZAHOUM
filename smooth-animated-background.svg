<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">ZAHOUM — smooth animated anime night background</title>
  <desc id="desc">A custom animated neon night city with drifting aurora, soft stars, a glowing moon, floating petals, and a hooded developer silhouette.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070816"/><stop offset=".47" stop-color="#1d1238"/><stop offset="1" stop-color="#061b2b"/>
    </linearGradient>
    <linearGradient id="auroraA" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".42" stop-color="#a855f7" stop-opacity=".48"/><stop offset=".7" stop-color="#ec4899" stop-opacity=".26"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".48" stop-color="#06b6d4" stop-opacity=".24"/><stop offset=".78" stop-color="#8b5cf6" stop-opacity=".3"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".45" stop-color="#c084fc" stop-opacity=".8"/><stop offset=".65" stop-color="#22d3ee" stop-opacity=".64"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30264e"/><stop offset="1" stop-color="#080d20"/></linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#c4b5fd" stop-opacity=".47"/><stop offset=".42" stop-color="#818cf8" stop-opacity=".19"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="windows" width="24" height="25" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="8" height="10" rx="1" fill="#67e8f9" opacity=".48"/><rect x="16" y="7" width="4" height="8" rx="1" fill="#c4b5fd" opacity=".43"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="frame"><rect width="1200" height="390" rx="22"/></clipPath>
  </defs>
  <style>
    .aurora-a{animation:auroraA 22s ease-in-out infinite alternate;transform-origin:center}
    .aurora-b{animation:auroraB 28s ease-in-out infinite alternate;transform-origin:center}
    .moon-halo{animation:moonPulse 8s ease-in-out infinite}
    .star{animation:twinkle 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .star.s2{animation-delay:-1.4s}.star.s3{animation-delay:-3s}.star.s4{animation-delay:-.7s}
    .float-petal{animation:petalDrift 13s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .float-petal.p2{animation-delay:-6s}.float-petal.p3{animation-delay:-9s}
    .meteor{animation:shootingStar 14s linear infinite;opacity:0}
    .neon{animation:neonPulse 5.5s ease-in-out infinite}
    .scan{animation:scanMove 9s linear infinite}
    @keyframes auroraA{0%{transform:translateX(-50px) translateY(7px) scale(1)}100%{transform:translateX(52px) translateY(-8px) scale(1.08)}}
    @keyframes auroraB{0%{transform:translateX(42px) translateY(-5px) scale(1.04)}100%{transform:translateX(-38px) translateY(8px) scale(1)}}
    @keyframes moonPulse{0%,100%{opacity:.72;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
    @keyframes twinkle{0%,100%{opacity:.32;transform:scale(.78)}50%{opacity:1;transform:scale(1.18)}}
    @keyframes petalDrift{0%,100%{transform:translate(0,0) rotate(0deg);opacity:.25}50%{transform:translate(22px,-18px) rotate(26deg);opacity:.9}}
    @keyframes shootingStar{0%,68%,100%{opacity:0;transform:translate(0,0)}70%{opacity:.95}78%{opacity:0;transform:translate(-260px,110px)}}
    @keyframes neonPulse{0%,100%{opacity:.62}50%{opacity:1}}
    @keyframes scanMove{0%{transform:translateY(-390px)}100%{transform:translateY(390px)}}
    @media (prefers-reduced-motion: reduce){.aurora-a,.aurora-b,.moon-halo,.star,.float-petal,.meteor,.neon,.scan{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="390" fill="url(#sky)"/>
    <ellipse class="aurora-a" cx="475" cy="125" rx="470" ry="115" fill="url(#auroraA)" filter="url(#softGlow)"/>
    <ellipse class="aurora-b" cx="845" cy="150" rx="450" ry="105" fill="url(#auroraB)" filter="url(#softGlow)"/>
    <circle class="moon-halo" cx="927" cy="99" r="128" fill="url(#moonGlow)"/>
    <circle cx="927" cy="99" r="43" fill="#e1e9ff" opacity=".94"/>
    <circle cx="942" cy="84" r="37" fill="#a5b4fc" opacity=".43"/>
    <g fill="#f5f3ff">
      <circle class="star" cx="70" cy="50" r="1.8"/><circle class="star s2" cx="142" cy="101" r="1.3"/><circle class="star s3" cx="220" cy="40" r="1.6"/><circle class="star s4" cx="294" cy="82" r="1.2"/>
      <circle class="star s2" cx="350" cy="27" r="1.8"/><circle class="star s3" cx="414" cy="68" r="1.2"/><circle class="star" cx="490" cy="39" r="1.5"/><circle class="star s4" cx="556" cy="88" r="1.4"/>
      <circle class="star s3" cx="624" cy="37" r="1.4"/><circle class="star s2" cx="696" cy="69" r="1.6"/><circle class="star" cx="760" cy="34" r="1.1"/><circle class="star s4" cx="1018" cy="35" r="1.4"/>
      <circle class="star s3" cx="1095" cy="81" r="1.8"/><circle class="star s2" cx="1150" cy="45" r="1.3"/><circle class="star" cx="1075" cy="161" r="1.1"/><circle class="star s4" cx="817" cy="128" r="1.5"/>
    </g>
    <g class="meteor" stroke-linecap="round"><path d="M1090 30L1008 76" stroke="#e9d5ff" stroke-width="2"/><path d="M1090 30L1018 70" stroke="#67e8f9" stroke-width="5" opacity=".25" filter="url(#glow)"/></g>
    <g class="float-petal" transform="translate(342 114)" fill="#f0abfc" opacity=".75"><path d="M0 -9 C6 -7 7 2 0 9 C-7 2 -6 -7 0 -9Z"/></g>
    <g class="float-petal p2" transform="translate(1032 218) rotate(22)" fill="#f9a8d4" opacity=".8"><path d="M0 -9 C6 -7 7 2 0 9 C-7 2 -6 -7 0 -9Z"/></g>
    <g class="float-petal p3" transform="translate(746 138) rotate(-18)" fill="#c4b5fd" opacity=".7"><path d="M0 -9 C6 -7 7 2 0 9 C-7 2 -6 -7 0 -9Z"/></g>
    <g stroke="#a78bfa" stroke-width="1.4" opacity=".8"><path d="M167 51v14m-7-7h14"/><path d="M692 111v12m-6-6h12"/><path d="M1080 181v12m-6-6h12"/></g>
    <path d="M0 254V219H43V171H78V229H106V188H144V239H176V149H219V224H258V181H291V236H327V197H364V254H1200V390H0Z" fill="#11152e"/>
    <g opacity=".82" fill="#172344"><path d="M0 292V240H55V276H87V215H126V292H156V253H191V282H230V234H267V294H302V251H341V291H375V229H416V292H454V262H489V301Z"/><path d="M705 303V248H745V215H786V300H824V239H865V283H899V222H946V299H978V257H1017V294H1055V212H1096V298H1137V251H1170V285H1200V390H705Z"/></g>
    <g fill="url(#windows)" opacity=".78"><path d="M12 230h58v108H12z"/><path d="M94 244h54v94H94z"/><path d="M182 171h58v167h-58z"/><path d="M266 207h46v131h-46z"/><path d="M330 221h58v117h-58z"/><path d="M723 259h48v79h-48z"/><path d="M795 229h58v109h-58z"/><path d="M880 234h52v104h-52z"/><path d="M962 264h45v74h-45z"/><path d="M1040 224h60v114h-60z"/><path d="M1116 256h58v82h-58z"/></g>
    <rect y="309" width="1200" height="81" fill="#090d1c" opacity=".9"/>
    <rect class="neon" y="307" width="1200" height="3" fill="url(#horizon)" filter="url(#glow)"/>
    <path d="M0 346L1200 325M0 366L1200 353" stroke="#25365f" stroke-width="1" opacity=".7"/>
    <g class="neon" opacity=".9" filter="url(#glow)"><path d="M70 327h120" stroke="#22d3ee" stroke-width="2"/><path d="M1000 337h122" stroke="#c084fc" stroke-width="2"/></g>
    <g transform="translate(600 245)">
      <ellipse cx="2" cy="111" rx="90" ry="12" fill="#020617" opacity=".8"/>
      <path d="M-78 106L-62 36Q-54 5-24-8L-18-34H27L34-7Q62 4 72 36L89 106Z" fill="url(#coat)" stroke="#6d4ba6" stroke-width="2"/>
      <path d="M-42 0Q-57-41-24-62Q5-82 31-54Q47-35 35 1L19 24H-23Z" fill="#0a1024" stroke="#a78bfa" stroke-width="2"/>
      <path d="M-25-9Q0-19 25-8L19 15H-18Z" fill="#172344"/>
      <path d="M-19 3L-2 7M4 7L20 3" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
      <path d="M-63 44L-29 32L-10 106M56 43L25 31L10 106" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".85"/>
      <path d="M-28 30L0 49L28 30" fill="none" stroke="#a78bfa" stroke-width="2"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="48" y="74" fill="#c4b5fd" font-size="13" letter-spacing="4">DEVELOPER PROFILE // 001</text>
      <text x="48" y="124" fill="#fff" font-size="49" font-weight="800" letter-spacing="3">ZAHOUM</text>
      <text x="51" y="153" fill="#67e8f9" font-size="15" letter-spacing="2">FULL-STACK WEB DEVELOPER</text>
      <path d="M50 174H280" stroke="#a78bfa" stroke-width="2"/>
      <text x="50" y="199" fill="#cbd5e1" font-size="12">&lt; building ideas into reality /&gt;</text>
    </g>
    <g font-family="ui-monospace,monospace" font-size="10" fill="#a5f3fc" opacity=".9"><text x="1036" y="177">01001010</text><text x="1054" y="193">10100101</text><text x="1009" y="209">00110110</text></g>
    <rect class="scan" x="0" y="0" width="1200" height="28" fill="#fff" opacity=".025"/>
    <rect x="1" y="1" width="1198" height="388" rx="21" fill="none" stroke="#a78bfa" stroke-opacity=".45"/>
  </g>
</svg>
