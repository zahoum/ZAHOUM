<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-label="Smooth animated purple and cyan divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".28" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#f472b6"/><stop offset=".72" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-400%" width="200%" height="900%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .beam{stroke-dasharray:170 1030;animation:slide 8s ease-in-out infinite}
    .beam2{stroke-dasharray:95 1105;animation:slide 11s ease-in-out infinite reverse;opacity:.7}
    .point{animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes slide{0%{stroke-dashoffset:0;opacity:.45}50%{opacity:1}100%{stroke-dashoffset:-1200;opacity:.45}}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
    @media(prefers-reduced-motion:reduce){.beam,.beam2,.point{animation:none!important}}
  </style>
  <path d="M10 17H1190" stroke="#27304b" stroke-width="1"/>
  <path d="M10 17H1190" stroke="url(#line)" stroke-width="2" opacity=".8" filter="url(#glow)"/>
  <path class="beam" d="M10 17H1190" stroke="#c4b5fd" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <path class="beam2" d="M10 17H1190" stroke="#67e8f9" stroke-width="1.5" fill="none"/>
  <circle class="point" cx="600" cy="17" r="3" fill="#fff" filter="url(#glow)"/>
</svg>
